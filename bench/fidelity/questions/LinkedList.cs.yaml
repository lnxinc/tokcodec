    type: structural
    question: "Which interfaces does `LinkedList<T>` implement?"
    expected: "ICollection<T>, ICollection, IReadOnlyCollection<T>, ISerializable, IDeserializationCallback"
    level_expected_to_answer: 3
    notes: "line 15"
  - id: linkedlist-02
    type: structural
    question: "What namespace is `LinkedList<T>` declared in?"
    expected: "System.Collections.Generic"
    level_expected_to_answer: 3
    notes: "line 9"
  - id: linkedlist-03
    type: structural
    question: "What is the full signature of the `AddAfter` overload that takes a value and returns a node?"
    expected: "public LinkedListNode<T> AddAfter(LinkedListNode<T> node, T value)"
    level_expected_to_answer: 3
    notes: "line 74"
  - id: linkedlist-04
    type: structural
    question: "What is the declaration line of the nested `Enumerator` type, including the interfaces it implements?"
    expected: "public struct Enumerator : IEnumerator<T>, IEnumerator, ISerializable, IDeserializationCallback"
    level_expected_to_answer: 3
    notes: "line 503"
  - id: linkedlist-05
    type: detail
