    type: value
    question: "Which `SR` resource string is used for the `InvalidOperationException` thrown by `ValidateNode` when the node belongs to a different list?"
    expected: "SR.ExternalLinkedListNode"
    level_expected_to_answer: 2
    notes: "line 436, inside method body"
