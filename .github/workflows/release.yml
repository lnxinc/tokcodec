name: Release
# Triggered by pushing a tag like v0.1.0. Publishes to PyPI and npm with
# trusted publishing (OIDC): no long-lived tokens anywhere. See RELEASING.md
# for the one-time setup on pypi.org and npmjs.com.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # re-run the publish steps for the current version (already-published artifacts are skipped)
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: |
          case "$GITHUB_REF_NAME" in v*) uv run python scripts/check_versions.py "$GITHUB_REF_NAME" ;; *) uv run python scripts/check_versions.py ;; esac
      - run: uv run pytest -q
  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
  npm:
    needs: pypi   # the launcher pins tokcodec@<version> on PyPI, so PyPI must land first
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # npm trusted publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - name: Show the OIDC identity npm will see (no secrets)
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).value")
          echo "$tok" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | node -p "const c=JSON.parse(require('fs').readFileSync(0,'utf8')); ({repository:c.repository, repository_owner:c.repository_owner, workflow_ref:c.workflow_ref, environment:c.environment, ref:c.ref, event_name:c.event_name})"
      - name: Publish unless this version is already on npm
        run: |
          v=$(node -p "require('./npm/package.json').version")
          if npm view "tokcodec@$v" version >/dev/null 2>&1; then
            echo "tokcodec@$v already on npm, skipping"
          else
            cd npm && npm publish --provenance --access public
          fi
  github-release:
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
