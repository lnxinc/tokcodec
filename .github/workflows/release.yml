name: Release
# Triggered by pushing a tag like v0.1.0. Publishes to PyPI and npm with
# trusted publishing (OIDC): no long-lived tokens anywhere. See RELEASING.md
# for the one-time setup on pypi.org and npmjs.com.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run python scripts/check_versions.py "${GITHUB_REF_NAME}"
      - run: uv run pytest -q
  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
  npm:
    needs: pypi   # the launcher pins tokcodec@<version> on PyPI, so PyPI must land first
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # npm trusted publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - name: Publish unless this version is already on npm
        run: |
          v=$(node -p "require('./npm/package.json').version")
          if npm view "tokcodec@$v" version >/dev/null 2>&1; then
            echo "tokcodec@$v already on npm, skipping"
          else
            cd npm && npm publish --provenance --access public
          fi
  github-release:
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
