[project]
name = "tokcodec"
version = "0.1.0"
description = "A codec for LLM context: cut the tokens AI coding tools burn on logs, JSON and source by 30-95%"
readme = "README.md"
authors = [{ name = "LNX Inc." }]
license = "MIT"
requires-python = ">=3.12"
keywords = ["llm", "tokens", "claude", "claude-code", "prompt-compression", "context-window", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Filters",
]

dependencies = [
    "anthropic>=1.3.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]
bench = [
    "pyyaml>=6",
]

[project.scripts]
tokcodec = "tokcodec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tokcodec"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.urls]
Sponsor = "https://lnxinc.com"
Homepage = "https://github.com/lnxinc/tokcodec"
Issues = "https://github.com/lnxinc/tokcodec/issues"
